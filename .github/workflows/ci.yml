name: Cloud Posture Analyzer CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: pytest

      - name: Verify clean environment
        run: python scan.py -i fixtures/clean_env.json --fail-on low

      - name: Generate HTML security report
        run: |
          mkdir -p reports
          python scan.py -i fixtures/sample_env.json --format html --output reports/report.html

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: cloud-posture-security-report
          path: reports/
          if-no-files-found: error
